<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>❤️ Серця та Зорі ⭐ | Гра для двох</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #121016;
      --card-bg: #1c1824;
      --accent: #ff4d6d;
      --accent-glow: rgba(255, 77, 109, 0.35);
      --star: #ffb703;
      --star-glow: rgba(255, 183, 3, 0.35);
      --text: #f8f9fa;
      --text-muted: #a09cb0;
      --border: #2e283b;
      --key-bg: #262133;
      --key-active: #38314a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      overflow-x: hidden;
    }

    #app {
      width: 100%;
      max-width: 440px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .title {
      font-size: 1.25rem;
      font-weight: 700;
      background: linear-gradient(90deg, #ff4d6d, #ffb703);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .author-badge {
      display: inline-block;
      font-size: 0.8rem;
      background: rgba(255, 77, 109, 0.15);
      color: #ff85a1;
      padding: 4px 10px;
      border-radius: 12px;
      border: 1px solid rgba(255, 77, 109, 0.3);
      margin-top: 4px;
    }

    .btn-icon {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 12px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.2s;
    }

    .btn-icon:active {
      transform: scale(0.95);
    }

    .input-display {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin: 8px 0;
    }

    .digit-box {
      width: 56px;
      height: 64px;
      background: var(--card-bg);
      border: 2px solid var(--border);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      font-weight: 700;
      transition: all 0.2s;
    }

    .digit-box.filled {
      border-color: var(--accent);
      box-shadow: 0 0 12px var(--accent-glow);
    }

    .history {
      flex: 1;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 12px;
      max-height: 220px;
      min-height: 140px;
      overflow-y: auto;
      display: flex;
      flex-direction: column-reverse;
      gap: 8px;
    }

    .history-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 10px;
      font-size: 1.05rem;
    }

    .guess-code {
      font-weight: 700;
      letter-spacing: 4px;
    }

    .feedback-badges {
      display: flex;
      gap: 8px;
      align-items: center;
      font-weight: 600;
    }

    .badge-heart {
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 2px;
    }

    .badge-star {
      color: var(--star);
      display: flex;
      align-items: center;
      gap: 2px;
    }

    .numpad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .key {
      background: var(--key-bg);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 1.5rem;
      font-weight: 600;
      padding: 14px 0;
      border-radius: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
    }

    .key:active {
      background: var(--key-active);
      transform: scale(0.96);
    }

    .key-action {
      font-size: 1.1rem;
      color: var(--text-muted);
    }

    .key-submit {
      background: var(--accent);
      color: white;
      border: none;
    }

    .key-submit:active {
      background: #e63956;
    }

    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 100;
    }

    .modal {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 24px;
      width: 100%;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      text-align: center;
    }

    .modal input, .modal textarea {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      color: var(--text);
      font-size: 1rem;
      outline: none;
      resize: none;
    }

    .modal input:focus, .modal textarea:focus {
      border-color: var(--accent);
    }

    .modal-actions {
      display: flex;
      gap: 10px;
    }

    .btn-primary {
      flex: 1;
      background: var(--accent);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-secondary {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 12px 18px;
      border-radius: 12px;
      cursor: pointer;
    }

    .letter-card {
      background: rgba(255, 77, 109, 0.08);
      border: 1px dashed var(--accent);
      border-radius: 14px;
      padding: 16px;
      text-align: left;
      white-space: pre-wrap;
      font-size: 0.95rem;
      line-height: 1.5;
      max-height: 260px;
      overflow-y: auto;
    }

    canvas#confetti {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 99;
    }
  </style>
</head>
<body>

  <canvas id="confetti"></canvas>

  <div id="app">
    <header>
      <div>
        <div class="title">Серця та Зорі</div>
        <div id="custom-badge" class="author-badge" style="display: none;"></div>
      </div>
      <div style="display: flex; gap: 8px;">
        <button id="sound-btn" class="btn-icon">🔊</button>
        <button id="create-btn" class="btn-icon">✨ Загадати</button>
      </div>
    </header>

    <div class="input-display">
      <div class="digit-box" id="d0"></div>
      <div class="digit-box" id="d1"></div>
      <div class="digit-box" id="d2"></div>
      <div class="digit-box" id="d3"></div>
    </div>

    <div class="history" id="history-box"></div>

    <div class="numpad">
      <button class="key" data-val="1">1</button>
      <button class="key" data-val="2">2</button>
      <button class="key" data-val="3">3</button>
      <button class="key" data-val="4">4</button>
      <button class="key" data-val="5">5</button>
      <button class="key" data-val="6">6</button>
      <button class="key" data-val="7">7</button>
      <button class="key" data-val="8">8</button>
      <button class="key" data-val="9">9</button>
      <button class="key key-action" id="key-del">⌫</button>
      <button class="key" data-val="0">0</button>
      <button class="key key-submit" id="key-ok">✓</button>
    </div>
  </div>

  <!-- Модальне вікно створення нової гри -->
  <div class="modal-overlay" id="create-modal">
    <div class="modal">
      <h3 style="color: var(--accent);">Створити таємницю</h3>
      <p style="font-size: 0.85rem; color: var(--text-muted);">
        Введи будь-які 4 цифри (числа можуть повторюватися та починатися з нуля).
      </p>
      <input type="text" id="new-code" placeholder="Код (напр. 1011)" maxlength="4" style="text-align: center; letter-spacing: 6px; font-weight: bold; font-size: 1.3rem;">
      <input type="text" id="new-author" placeholder="Твоє ім'я (напр. Саша)">
      <textarea id="new-letter" rows="4" placeholder="Твій лист або послання..."></textarea>
      
      <div class="modal-actions">
        <button class="btn-secondary" id="close-modal">Скасувати</button>
        <button class="btn-primary" id="gen-link-btn">Сформувати посилання</button>
      </div>

      <div id="link-result" style="display: none; margin-top: 10px;">
        <input type="text" id="share-link" readonly style="font-size: 0.8rem; margin-bottom: 8px;">
        <button class="btn-primary" id="copy-btn" style="width: 100%;">📋 Скопіювати посилання</button>
      </div>
    </div>
  </div>

  <!-- Модальне вікно перемоги -->
  <div class="modal-overlay" id="win-modal">
    <div class="modal">
      <h2 style="color: var(--accent);">Шифр розгадано! 🎉</h2>
      <p id="win-stats" style="color: var(--text-muted); font-size: 0.9rem;"></p>
      <div class="letter-card" id="win-letter"></div>
      <button class="btn-primary" onclick="location.reload();">Грати знову</button>
    </div>
  </div>

  <script>
    // --- ЗВУКИ ТА ВІБРАЦІЯ ---
    let soundEnabled = true;
    let audioCtx = null;

    function getAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    function playBeep(freq = 440, duration = 0.08) {
      if (!soundEnabled) return;
      try {
        const ctx = getAudioContext();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.frequency.value = freq;
        osc.connect(gain);
        gain.connect(ctx.destination);
        gain.gain.setValueAtTime(0.08, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + duration);
        osc.start();
        osc.stop(ctx.currentTime + duration);
      } catch (e) {}
    }

    function vibrate(ms = 30) {
      if (window.Telegram?.WebApp?.HapticFeedback) {
        window.Telegram.WebApp.HapticFeedback.impactOccurred('light');
      } else if (navigator.vibrate) {
        navigator.vibrate(ms);
      }
    }

    document.getElementById('sound-btn').onclick = () => {
      soundEnabled = !soundEnabled;
      document.getElementById('sound-btn').textContent = soundEnabled ? '🔊' : '🔇';
    };

    // --- БЕЗПЕЧНЕ КОДУВАННЯ ТА ДЕКОДУВАННЯ UTF-8 ---
    function safeBtoa(str) {
      return btoa(encodeURIComponent(str).replace(/%([0-9A-F]{2})/g, (match, p1) => {
        return String.fromCharCode('0x' + p1);
      }));
    }

    function safeAtob(str) {
      return decodeURIComponent(Array.prototype.map.call(atob(str), (c) => {
        return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
      }).join(''));
    }

    // --- СТАН ГРИ ---
    let secretCode = "1234";
    let authorName = "";
    let secretLetter = "Вітаю з перемогою! ❤️";
    let currentInput = "";
    let attemptsCount = 0;
    let isGameOver = false;

    // --- ЗЧИТУВАННЯ ПОСИЛАННЯ ---
    function initGame() {
      const urlParams = new URLSearchParams(window.location.search);
      let rawData = urlParams.get('game') || urlParams.get('data');

      if (rawData) {
        try {
          rawData = rawData.replace(/ /g, '+');
          const payload = JSON.parse(safeAtob(rawData));
          if (payload.code && payload.code.length === 4) {
            secretCode = String(payload.code);
            authorName = payload.author || "";
            secretLetter = payload.letter || secretLetter;

            const badge = document.getElementById('custom-badge');
            badge.textContent = authorName ? `💌 Загадка від: ${authorName}` : '💌 Особиста загадка';
            badge.style.display = 'inline-block';
          }
        } catch (e) {
          console.error("Помилка розшифровки посилання:", e);
        }
      } else {
        secretCode = Array.from({length: 4}, () => Math.floor(Math.random() * 10)).join('');
      }
    }

    initGame();

    // --- ВВЕДЕННЯ ЧИСЕЛ ---
    function updateDisplay() {
      for (let i = 0; i < 4; i++) {
        const box = document.getElementById(`d${i}`);
        box.textContent = currentInput[i] || "";
        box.classList.toggle('filled', !!currentInput[i]);
      }
    }

    document.querySelectorAll('.key[data-val]').forEach(btn => {
      btn.onclick = () => {
        if (isGameOver || currentInput.length >= 4) return;
        currentInput += btn.dataset.val;
        playBeep(480);
        vibrate();
        updateDisplay();
      };
    });

    document.getElementById('key-del').onclick = () => {
      if (isGameOver || currentInput.length === 0) return;
      currentInput = currentInput.slice(0, -1);
      playBeep(320);
      vibrate();
      updateDisplay();
    };

    // --- АЛГОРИТМ MASTERMIND З ПОВТОРАМИ ТА НУЛЯМИ ---
    function checkGuess(guess, secret) {
      let hearts = 0;
      let stars = 0;

      const gArr = guess.split('');
      const sArr = secret.split('');
      const gUsed = [false, false, false, false];
      const sUsed = [false, false, false, false];

      // 1-й прохід: точні збіги (Серця)
      for (let i = 0; i < 4; i++) {
        if (gArr[i] === sArr[i]) {
          hearts++;
          gUsed[i] = true;
          sUsed[i] = true;
        }
      }

      // 2-й прохід: збіги не на своїх позиціях (Зорі)
      for (let i = 0; i < 4; i++) {
        if (!gUsed[i]) {
          for (let j = 0; j < 4; j++) {
            if (!sUsed[j] && gArr[i] === sArr[j]) {
              stars++;
              sUsed[j] = true;
              break;
            }
          }
        }
      }

      return { hearts, stars };
    }

    // --- ПІДТВЕРДЖЕННЯ ХОДУ ---
    document.getElementById('key-ok').onclick = () => {
      if (isGameOver || currentInput.length !== 4) return;

      attemptsCount++;
      const { hearts, stars } = checkGuess(currentInput, secretCode);

      const item = document.createElement('div');
      item.className = 'history-item';
      item.innerHTML = `
        <span class="guess-code">${currentInput}</span>
        <div class="feedback-badges">
          <span class="badge-heart">${hearts} ❤️</span>
          <span class="badge-star">${stars} ⭐</span>
        </div>
      `;
      document.getElementById('history-box').appendChild(item);

      if (hearts === 4) {
        handleWin();
      } else {
        playBeep(260, 0.15);
      }

      currentInput = "";
      updateDisplay();
    };

    // --- ПЕРЕМОГА ---
    function handleWin() {
      isGameOver = true;
      playBeep(660, 0.2);
      setTimeout(() => playBeep(880, 0.3), 150);
      startConfetti();

      document.getElementById('win-stats').textContent = `Спроб: ${attemptsCount}`;
      document.getElementById('win-letter').textContent = secretLetter;
      setTimeout(() => {
        document.getElementById('win-modal').style.display = 'flex';
      }, 500);
    }

    // --- ГЕНЕРАТОР ПОСИЛАНЬ ---
    const createModal = document.getElementById('create-modal');
    document.getElementById('create-btn').onclick = () => createModal.style.display = 'flex';
    document.getElementById('close-modal').onclick = () => {
      createModal.style.display = 'none';
      document.getElementById('link-result').style.display = 'none';
    };

    document.getElementById('gen-link-btn').onclick = () => {
      const code = document.getElementById('new-code').value.trim();
      const author = document.getElementById('new-author').value.trim();
      const letter = document.getElementById('new-letter').value.trim();

      if (!/^\d{4}$/.test(code)) {
        alert("Код має містити рівно 4 будь-які цифри!");
        return;
      }

      const payload = { code, author, letter };
      const rawBase64 = safeBtoa(JSON.stringify(payload));
      const safeParam = encodeURIComponent(rawBase64);
      const url = `${window.location.origin}${window.location.pathname}?game=${safeParam}`;

      const shareInput = document.getElementById('share-link');
      shareInput.value = url;
      document.getElementById('link-result').style.display = 'block';
    };

    document.getElementById('copy-btn').onclick = async () => {
      const shareInput = document.getElementById('share-link');
      try {
        await navigator.clipboard.writeText(shareInput.value);
        alert("Посилання успішно скопійовано!");
      } catch (err) {
        shareInput.select();
        document.execCommand('copy');
        alert("Посилання скопійовано!");
      }
    };

    // --- СВЯТКОВЕ КОНФЕТІ ---
    function startConfetti() {
      const canvas = document.getElementById('confetti');
      const ctx = canvas.getContext('2d');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      const particles = Array.from({ length: 60 }, () => ({
        x: Math.random() * canvas.width,
        y: -10,
        r: Math.random() * 6 + 4,
        d: Math.random() * 60,
        color: ['#ff4d6d', '#ff758f', '#ffb703', '#ffffff'][Math.floor(Math.random() * 4)],
        tilt: Math.random() * 10 - 10,
        tiltAngleInc: Math.random() * 0.08 + 0.04,
        tiltAngle: 0
      }));

      let animationFrame;
      function render() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        particles.forEach(p => {
          p.tiltAngle += p.tiltAngleInc;
          p.y += (Math.cos(p.d) + 3 + p.r / 2) / 1.8;
          p.tilt = Math.sin(p.tiltAngle) * 12;

          ctx.beginPath();
          ctx.lineWidth = p.r / 2;
          ctx.strokeStyle = p.color;
          ctx.moveTo(p.x + p.tilt + p.r / 4, p.y);
          ctx.lineTo(p.x + p.tilt, p.y + p.tilt + p.r / 4);
          ctx.stroke();
        });

        if (particles.some(p => p.y < canvas.height)) {
          animationFrame = requestAnimationFrame(render);
        }
      }
      render();
    }
  </script>
</body>
</html>
